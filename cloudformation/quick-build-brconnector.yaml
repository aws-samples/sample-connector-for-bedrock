AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31 
Description: >
  AWS CloudFormation template for bootstraps BRConnector
  refer: https://github.com/aws-samples/sample-connector-for-bedrock
Metadata:
  LICENSE: MIT-0 License
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: 
          default: "VPC settings for BRConnector"
        Parameters:
          - VpcStackName
          - VpcId
          - PublicSubnet1Id
          - PublicSubnet2Id
          - PrivateSubnet1Id
          - PrivateSubnet2Id

      - Label: 
          default: "Compute settings for BRConnector"
        Parameters:
          - ComputeType

      - Label: 
          default: "For EC2 settings" 
        Parameters:
          - EC2InstanceType
          # - EC2InstanceAMI

      - Label: 
          default: "For Lambda settings (!!! If LambdaEdgeVersionArn is NULL, PUBLIC FUNCTION URL will be used. !!!)"
        Parameters:
          - EcrRepo
          - LambdaArch
          - LambdaEdgeVersionArn

      - Label:
          default: "For ECS settings"
        Parameters:
          - ECSTaskCPU
          - ECSTaskMemory
          - ECSServiceDesiredCount

      - Label: 
          default: "Settings for RDS PostgreSQL"
        Parameters:
          - DatabaseMode
          - PerformanceMode
          - PGDatabase
          - PGUser
          - PGPassword

      - Label: 
          default: "Others Settings"
        Parameters:
          - EnableCloudfront
          - BRConnectorVersion
          - AutoUpdateBRConnector

      - Label:
          default: "Claude Code Web (optional)"
        Parameters:
          - EnableClaudeCodeWeb
          - ClaudeCodeDefaultModel
          - ClaudeCodeBackgroundModel
          - ClaudeCodeWebImageBuildId
          - EnableWebSearch

      - Label: 
          default: "Debugging Settings"
        Parameters:
          - KeepEc2

Parameters:
  VpcStackName:
    Description: Name of an existing VPC stack to import (leave empty to use VpcId and subnet IDs)
    Type: String
    Default: ''

  # cannot use type AWS::EC2::VPC::Id or AWS::EC2::Subnet::Id
  # because these types does not allow null value to parameters
  VpcId:
    Description: Select VPC (leave empty if using VpcStackName)
    Type: String #AWS::EC2::VPC::Id
    AllowedPattern: '(^$|^vpc-[a-z0-9]+$)'
    Default: ''
  PublicSubnet1Id:
    Description: Select one PUBLIC subnet for EC2/ECS (leave empty if using VpcStackName)
    Type: String #AWS::EC2::Subnet::Id
    AllowedPattern: '(^$|^subnet-[a-z0-9]+$)'
    Default: ''
  PublicSubnet2Id:
    Description: Select one PUBLIC subnet for EC2/ECS (leave empty if using VpcStackName)
    Type: String #AWS::EC2::Subnet::Id
    AllowedPattern: '(^$|^subnet-[a-z0-9]+$)'
    Default: ''
  PrivateSubnet1Id:
    Description: Select one PRIVATE subnet for Lambda (leave empty if using VpcStackName)
    Type: String #AWS::EC2::Subnet::Id
    AllowedPattern: '(^$|^subnet-[a-z0-9]+$)'
    Default: ''
  PrivateSubnet2Id:
    Description: Select one more PRIVATE subnet for RDS (leave empty if using VpcStackName)
    Type: String #AWS::EC2::Subnet::Id
    AllowedPattern: '(^$|^subnet-[a-z0-9]+$)'
    Default: ''

  ComputeType:
    Description: >-
      Choose using Lambda, EC2, ECS or Lambda Web Functions to running BRConnector.
      lambda-web runs on Lambda Web Functions, which need no adapter and support
      native response streaming, and is only available in the Regions that offer them.
    Type: String
    AllowedValues:
      - ec2
      - lambda
      - lambda-web
      - ecs
    Default: ec2

  WebFnAuthType:
    Description: >-
      Only used by ComputeType lambda-web. IamAuth has Lambda reject any caller that is
      not this stack's CloudFront distribution, so the endpoint domain stops being a way
      around it; this is the default. ApplicationManaged leaves that domain reachable by
      anyone who knows the name, with BRConnector's own API key as the only check - pick
      it only if callers must reach the endpoint directly, or if lambda:PutResourcePolicy
      is unavailable, in which case the stack fails on WebFnResourcePolicy.
    Type: String
    AllowedValues:
      - ApplicationManaged
      - IamAuth
    Default: IamAuth

  SourceRepoUrl:
    Description: >-
      Used by ComputeType lambda-web and by Claude Code Web (EnableClaudeCodeWeb). The
      git repository the helper EC2 clones to build the lambda-web deployment package,
      and that CodeBuild clones to build the Claude Code Web backend image. Change it to
      build from a fork, for example while a change is still under review upstream.
    Type: String
    Default: https://github.com/aws-samples/sample-connector-for-bedrock.git

  SourceRef:
    Description: >-
      Used by ComputeType lambda-web and by Claude Code Web (EnableClaudeCodeWeb). The git
      ref of SourceRepoUrl that the lambda-web deployment package and the Claude Code Web
      backend image are built from. The upstream repository publishes no tags, so this is
      a branch or a commit. The lambda-web build clones with --branch, so it needs a
      branch.
    Type: String
    Default: main

  ECSTaskCPU:
    Description: CPU units for ECS task (1 vCPU = 1024 CPU units)
    Type: Number
    Default: 1024
    AllowedValues: [256, 512, 1024, 2048, 4096]

  ECSTaskMemory:
    Description: Memory (MiB) for ECS task
    Type: Number
    Default: 2048
    AllowedValues: [512, 1024, 2048, 4096, 8192]

  ECSServiceDesiredCount:
    Description: Desired number of ECS tasks to run
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

  PerformanceMode:
    Description: If set to true, chat history will not be saved. 
    Type: String
    AllowedValues:
      - true
      - false
    Default: false

  EC2InstanceType:
    Description: >-
      Choose EC2 instance type, OS will be Amazon Linux 2023. Ignored when
      ComputeType is lambda-web, which always uses t4g.medium: that path builds the
      deployment package on this instance, Lambda Web Functions run arm64 only, and
      the build host has to match the runtime architecture.
    Type: String
    AllowedValues:
      - t3.medium
      - t4g.medium
      # - m5.large
    Default: t3.medium
  # EC2InstanceAMI:
  #   Description: EC2 instance AMI is Amazon Linux 2023, do not support other distribution. 
  #   Type: String
  #   AllowedValues:
  #     - al2023-ami-kernel-default-x86_64
  #     - al2023-ami-kernel-default-arm64
  #   Default: al2023-ami-kernel-default-x86_64

  EcrRepo:
    Description: >-
      Prefix of private repo name , repo full name will be brc-<Random String>/x6u9o2u4/sample-connector-for-bedrock-lambda
    Type: String
    Default: brc

  LambdaArch:
    Description: >-
      Choose Architecture amd64 or arm64 for Lambda runtime
    Type: String
    AllowedValues:
      - amd64
      - arm64
    Default: arm64

  DatabaseMode:
    Description: >-
      Choose database mode:
      'Standalone' - Deploy RDS PostgreSQL
      'EC2Integrated' - Deploy PostgreSQL container in EC2
      'NoDB' - Do not deploy any backend database, in this mode only ADMIN KEY could access default models
    Type: String
    AllowedValues:
      - Standalone
      - EC2Integrated
      - NoDB
    Default: EC2Integrated

  PGDatabase:
    Description: PostgreSQL default database name
    Type: String
    Default: brconnector_db
  PGUser:
    Description: PostgreSQL default user name
    Type: String
    Default: postgres
  PGPassword:
    Description: PostgreSQL default password
    Type: String
    Default: mysecretpassword

  EnableCloudfront:
    Description: Enable Cloudfront or not, when using Lambda ComputeType. If you use EC2, this option will always be "true"
    Type: String
    AllowedValues:
      - true
      - false
    Default: true

  AutoUpdateBRConnector:
    Description: Auto update BRConnector image to newest version on Lambda & EC2
    Type: String
    AllowedValues:
      - true
      - false
    Default: true

  # put a parameters to choose version
  BRConnectorVersion:
    Description: choose BR Connector Version
    Type: String
    AllowedValues:
      - latest
      - "0.0.19"
      - "0.0.16"
      - "0.0.15"
    Default: latest

  KeepEc2:
    Description: keep EC2 instance for debugging when you deploy brconnector on Lambda
    Type: String
    AllowedValues:
      - true
      - false
    Default: true

  LambdaEdgeVersionArn:
    Description: Lambda@Edge version ARN. 
    Type: String
    AllowedPattern: (^$|.*us-east-1.*)
    ConstraintDescription: The Lambda@Edge version ARN must include 'us-east-1'
    Default: ''

  EnableClaudeCodeWeb:
    Description: >-
      Deploy Claude Code Web: Claude Code in the browser at <BRConnector URL>/cc/, signed
      in with a BRConnector API key, with its backend on Amazon Bedrock AgentCore Runtime
      (one microVM per key, billed to this account). Only takes effect when the stack is
      created. Needs ComputeType ec2, ecs or lambda-web, a database, and BRConnectorVersion
      latest unless ComputeType is lambda-web. The backend image is built by CodeBuild
      from SourceRepoUrl at SourceRef.
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'

  ClaudeCodeDefaultModel:
    Description: >-
      Claude Code Web only. BRConnector model name Claude Code uses when the user has not
      picked one (ANTHROPIC_MODEL). Bind it, as a bedrock-runtime-anthropic model, to the
      keys or groups that should use Claude Code Web.
    Type: String
    Default: claude-sonnet-5-5

  ClaudeCodeBackgroundModel:
    Description: >-
      Claude Code Web only. BRConnector model name Claude Code uses for background tasks
      (ANTHROPIC_DEFAULT_HAIKU_MODEL). Users cannot change it, so bind it to the same keys
      or groups as well.
    Type: String
    Default: claude-haiku-5-5

  ClaudeCodeWebImageBuildId:
    Description: >-
      Claude Code Web only. Change this value to rebuild the Claude Code Web backend
      image without touching anything else, for example to pick up new commits on
      SourceRef. Changing SourceRepoUrl, SourceRef or BRConnectorVersion also rebuilds
      the image, but rebuilds BRConnector itself too.
    Type: String
    Default: '1'

  EnableWebSearch:
    Description: >-
      Claude Code Web only. Create an AgentCore Gateway with the AgentCore Web Search
      connector, which Claude Code Web may call. Searches are billed per query to this
      account, not to any key. Creates nothing in a Region without AgentCore Web Search,
      such as us-west-1.
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'

Rules:
  # Claude Code Web needs a BRConnector that has /cc and normal (non-admin) keys.
  ClaudeCodeWebRequirements:
    RuleCondition: !Equals [!Ref EnableClaudeCodeWeb, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref ComputeType, 'lambda']]
        AssertDescription: >-
          Claude Code Web does not support ComputeType lambda: its 60-second timeout cuts
          off long streams. Use ec2, ecs or lambda-web.
      # Same test as the IsNoDB condition: without a database only the admin key exists,
      # and Claude Code Web refuses the admin key.
      - Assert: !And
          - !Not [!Equals [!Ref DatabaseMode, 'NoDB']]
          - !Not
            - !And
              - !Contains [['ecs', 'lambda-web'], !Ref ComputeType]
              - !Equals [!Ref DatabaseMode, 'EC2Integrated']
        AssertDescription: >-
          Claude Code Web needs a database, because it refuses the admin key. Set
          DatabaseMode to Standalone, or to EC2Integrated with ComputeType ec2.
      # ec2 and ecs run the published BRConnector image; pinned older versions have no /cc.
      - Assert: !Or
          - !Equals [!Ref ComputeType, 'lambda-web']
          - !Equals [!Ref BRConnectorVersion, 'latest']
        AssertDescription: >-
          Claude Code Web needs BRConnectorVersion latest with ComputeType ec2 or ecs;
          the pinned versions predate /cc.

Conditions:
  UseExistingVpcStack: !Not [!Equals [!Ref VpcStackName, '']]
  IsEc2: !Equals [!Ref ComputeType, 'ec2']
  IsLambda: !Equals [!Ref ComputeType, 'lambda']
  IsEcs: !Equals [!Ref ComputeType, 'ecs']
  IsLambdaWeb: !Equals [!Ref ComputeType, 'lambda-web']
  # EC2Integrated means a Postgres container on the helper EC2, reachable only from that
  # host, so the off-host compute types treat it as having no database. lambda-web joins
  # lambda and ecs here; without this it would be handed 172.17.0.1 and could never connect.
  IsNoDB: !Or
    - !Equals [!Ref DatabaseMode, 'NoDB']
    - !And [!Equals [!Ref ComputeType, 'lambda'], !Equals [!Ref DatabaseMode, 'EC2Integrated']]
    - !And [!Equals [!Ref ComputeType, 'ecs'], !Equals [!Ref DatabaseMode, 'EC2Integrated']]
    - !And [!Equals [!Ref ComputeType, 'lambda-web'], !Equals [!Ref DatabaseMode, 'EC2Integrated']]
  # IsPerformanceMode: !Or
  #   - !Equals [!Ref PerformanceMode, 'true']
  #   - !Condition IsNoDB
  DeployDB: !Not [!Condition IsNoDB]
  IsStandaloneDB: !Or
    - !Equals [!Ref DatabaseMode, 'Standalone']
    - !And [!Condition IsLambda, !Condition DeployDB]
    - !And [!Condition IsLambdaWeb, !Condition DeployDB]
  # A Web Function reaches the database only through a network connector, so the
  # connector and the RDS wiring exist only when lambda-web actually has a database.
  IsLambdaWebWithDB: !And [!Condition IsLambdaWeb, !Condition DeployDB]
  # OAC and the resource policy exist only for the IamAuth variant. With
  # ApplicationManaged, Lambda does not evaluate the resource policy at all, so signing
  # the origin request would buy nothing.
  IsLambdaWebIamAuth: !And [!Condition IsLambdaWeb, !Equals [!Ref WebFnAuthType, 'IamAuth']]
  IsEC2IntegratedDB: !Equals [!Ref DatabaseMode, 'EC2Integrated']
  IsEnableCloudfrontEc2: !Equals [!Ref ComputeType, 'ec2']
  IsEnableCloudfrontLambda: !And
    - !Equals [!Ref EnableCloudfront, 'true']
    - !Equals [!Ref ComputeType, 'lambda']
  IsAutoUpdate: !Equals [!Ref AutoUpdateBRConnector, 'true']
  IsAutoUpdateEc2: !And
    - !Equals [!Ref AutoUpdateBRConnector, 'true']
    - !Equals [!Ref ComputeType, 'ec2']
  IsAutoUpdateLambda: !And
    - !Equals [!Ref AutoUpdateBRConnector, 'true']
    - !Equals [!Ref ComputeType, 'lambda']
  NotKeepEc2: !Not [!Equals [!Ref KeepEc2, 'true']]
  IsPublicLambdaPermission: !And
    - !Equals [!Ref ComputeType, 'lambda']
    - !Equals [!Ref LambdaEdgeVersionArn, '']
  IsPrivateLambdaPermission: !And
    - !Equals [!Ref ComputeType, 'lambda']
    - !Not [!Equals [!Ref LambdaEdgeVersionArn, '']]
  IsClaudeCodeWeb: !Equals [!Ref EnableClaudeCodeWeb, 'true']
  # The Regions where AgentCore Web Search is available; anywhere else it creates nothing.
  IsClaudeCodeWebSearch: !And
    - !Condition IsClaudeCodeWeb
    - !Equals [!Ref EnableWebSearch, 'true']
    - !Or
      - !Equals [!Ref AWS::Region, us-east-1]
      - !Equals [!Ref AWS::Region, us-east-2]
      - !Equals [!Ref AWS::Region, us-west-2]
      - !Equals [!Ref AWS::Region, eu-west-1]
      - !Equals [!Ref AWS::Region, ap-southeast-2]
      - !Equals [!Ref AWS::Region, ap-northeast-1]

Mappings:
  ArchitectureMapping:
    amd64:
      Architecture: x86_64
    arm64:
      Architecture: arm64
  EC2InstanceAMIMapping:
    t3.medium:
      EC2InstanceAMI: al2023-ami-kernel-default-x86_64
    t4g.medium:
      EC2InstanceAMI: al2023-ami-kernel-default-arm64
  AWSRegionsPrefixListID:
  # aws ec2 describe-managed-prefix-lists  --region <REGION> | jq -r '.PrefixLists[] | select (.PrefixListName == "com.amazonaws.global.cloudfront.origin-facing") | .PrefixListId'
    us-east-1:
      PrefixList: pl-3b927c52
    us-east-2:
      PrefixList: pl-b6a144df
    us-west-1:
      PrefixList: pl-4ea04527
    us-west-2:
      PrefixList: pl-82a045eb

Resources:
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        # - arn:aws:iam::aws:policy/AdministratorAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
      Policies:
        - PolicyName: MyInlinePolicy-bedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Sid: InvokeModel
              Action:
              - 'bedrock:InvokeModelWithResponseStream'
              - 'bedrock:InvokeModel'
              Resource: 
              - 'arn:aws:bedrock:*::foundation-model/*'
              - 'arn:aws:bedrock:*:*:inference-profile/*'
            - Effect: Allow
              Sid: ListFM
              Action:
              - 'bedrock:ListFoundationModels'
              Resource: '*'
        - PolicyName: MyInlinePolicy-ssm-parameter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Sid: SSMPutParameter
              Action:
              - 'ssm:PutParameter'
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
              Resource: 'arn:aws:ssm:*:*:parameter/*'
        # - PolicyName: MyInlinePolicy-cfn-signal
        #   PolicyDocument:
        #     Version: '2012-10-17'
        #     Statement:
        #     - Effect: Allow
        #       Action: 'cloudformation:SignalResource'
        #       Resource: '*'
        #     - Effect: Allow
        #       Action: 's3:*'
        #       Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - Ref: EC2Role

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ec2-security-group-${AWS::StackName}"
      GroupDescription: "Security Group for EC2"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8866
          ToPort: 8866
          CidrIp: 10.0.0.0/8
        - Description: Allow HTTP from com.amazonaws.global.cloudfront.origin-facing
          IpProtocol: tcp
          FromPort: 8866
          ToPort: 8866
          SourcePrefixListId: !FindInMap [AWSRegionsPrefixListID, !Ref 'AWS::Region', PrefixList]
      VpcId: !If 
        - UseExistingVpcStack
        - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
        - !Ref VpcId

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "rds-security-group-${AWS::StackName}"
      GroupDescription: "Security Group for RDS"
      VpcId: !If 
        - UseExistingVpcStack
        - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
        - !Ref VpcId

  RdsSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: "tcp"
      FromPort: "5432"
      ToPort: "5432"
      SourceSecurityGroupId: !Ref RdsSecurityGroup

  LambdaSecurityGroup:
    Condition: IsLambda
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "lambda-security-group-${AWS::StackName}"
      GroupDescription: "Security Group for Lambda"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      VpcId: !If 
        - UseExistingVpcStack
        - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
        - !Ref VpcId

  MyPGParameterGroup:
    Condition: IsStandaloneDB
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: "My PostgreSQL Parameter Group"
      Family: "postgres16"
      Parameters:
        rds.force_ssl: "0"

  MyPGSubnetGroup:
    Condition: IsStandaloneDB
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets available for the RDS instance
      SubnetIds:
          - !If 
            - UseExistingVpcStack
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet1Id"
            - !Ref PrivateSubnet1Id
          - !If 
            - UseExistingVpcStack
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet2Id"
            - !Ref PrivateSubnet2Id

  MyPG:
    Condition: IsStandaloneDB
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: '20'
      DBName: !Ref PGDatabase
      DBInstanceClass: db.t4g.small
      Engine: postgres
      EngineVersion: "16.10"
      MasterUsername: postgres
      MasterUserPassword: !Ref PGPassword
      DBParameterGroupName: !Ref MyPGParameterGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DBSubnetGroupName: !Ref MyPGSubnetGroup

  MyEC2Instance:
    DependsOn: 
      - MySSMParameterFirstUserKey 
      - MySSMParameterAdminKey
      - MySSMParameterPGDB
      # - PrivateECRRepository
    Type: AWS::EC2::Instance
    Properties:
      # lambda-web builds the arm64 deployment package here, so the build host must be
      # arm64 too. Forcing it is deliberate: an x86 build uploads and the stack still
      # goes green, and the only symptom is the Web Function failing to load sharp.
      InstanceType: !If [IsLambdaWeb, t4g.medium, !Ref EC2InstanceType]
      # Fn::If is not allowed inside Fn::FindInMap's arguments, so the choice is made
      # around the whole value and each branch does its own lookup with a fixed key.
      ImageId: !If
        - IsLambdaWeb
        - !Join
          - ''
          - - resolve:ssm:/aws/service/ami-amazon-linux-latest/
            - !FindInMap [EC2InstanceAMIMapping, t4g.medium, EC2InstanceAMI]
        - !Join
          - ''
          - - resolve:ssm:/aws/service/ami-amazon-linux-latest/
            - !FindInMap [EC2InstanceAMIMapping, !Ref EC2InstanceType, EC2InstanceAMI]
      KeyName: !Ref "AWS::NoValue"
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: 'true'
          DeviceIndex: '0'
          GroupSet:
            - !Ref InstanceSecurityGroup
            - !Ref RdsSecurityGroup
          SubnetId: !If
            - UseExistingVpcStack
            - Fn::ImportValue: !Sub "${VpcStackName}-PublicSubnet1Id"
            - !Ref PublicSubnet1Id
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp2
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Join ["", ["BRConnectorInstance-", !Ref AWS::StackName]]
      UserData:
        # CcEnvArg is empty unless EnableClaudeCodeWeb is true. It is glued to the docker
        # run line without a space, so with the switch off that line is byte-identical and
        # existing stacks see no UserData change. The line must stay a single line holding
        # --name brconnector: the SSM auto-update replays it from the cloud-init log.
        Fn::Base64: !Sub
        - |-
          #!/bin/bash -xe
          # install packages & buildx
          yum install -y aws-cfn-bootstrap docker jq git cronie
          systemctl restart docker
          systemctl enable docker
          systemctl restart crond
          systemctl enable crond
          # mkdir -p ~/.docker/cli-plugins
          # wget -q -O ~/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.15.1/buildx-v0.15.1.linux-amd64
          # chmod a+x ~/.docker/cli-plugins/docker-buildx
          # docker run -t --rm --privileged tonistiigi/binfmt --install all
          # docker buildx inspect --bootstrap
          # docker buildx create --use --platform=linux/arm64,linux/amd64 --name multi-platform-builder
          # install regctl
          if [[ $(uname -m) == "x86_64" ]]; then
            curl -L -o regctl https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64
            chmod 755 regctl
            sudo mv regctl /usr/local/bin/
          else
            curl -L -o regctl https://github.com/regclient/regclient/releases/latest/download/regctl-linux-arm64
            chmod 755 regctl
            sudo mv regctl /usr/local/bin/
          fi

          # save default settings 
          export PGPWD=$(echo "${PGPassword}" |tee /root/pg-default-password.txt)
          export KEY=$(uuidgen |tee /root/admin-api-key.txt)
          export AWS_DEFAULT_REGION="${AWS::Region}"
          
          #REPO_PREFIX=${EcrRepo}-$(echo ${AWS::StackId}|awk -F'-' '{print $NF}')
          REPO_PREFIX=${EcrRepo}-${RandomString}
          echo $REPO_PREFIX
          aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          IMG_LAMBDA=x6u9o2u4/sample-connector-for-bedrock-lambda
          
          # lambda-web takes a zip from S3, not an image, so build it here. This instance is
          # forced to t4g.medium for this path, so the build is native arm64 and sharp
          # resolves its linux-arm64 prebuild. The script also forces the platform flags and
          # asserts the result, which is what catches a wrong binary before it ships.
          if [[ ${ComputeType} == "lambda-web" ]]; then
            build_webfn_zip() {
              dnf install -y git tar gzip zip
              export HOME=/root
              curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
              . /root/.nvm/nvm.sh
              nvm install 24
              node --version
              rm -rf /root/src
              git clone --depth 1 --branch ${SourceRef} ${SourceRepoUrl} /root/src
              cd /root/src
              test -f scripts/build-web-function-zip.sh || {
                echo "scripts/build-web-function-zip.sh is missing from ${SourceRepoUrl} at ref ${SourceRef}"
                return 1
              }
              npx -y pnpm@10.34.6 install --frozen-lockfile
              bash scripts/build-web-function-zip.sh
              # The bucket name is built here rather than Ref'd: WebFnCodeBucket is a
              # conditional resource, and referencing it from this shared UserData would
              # break the ec2, lambda and ecs paths, where it does not exist.
              aws s3 cp build/webfn/function.zip s3://brconnector-webfn-${AWS::AccountId}-${AWS::Region}-${RandomString}/brconnector/function.zip
              cd /root
            }
            # Report a build failure to the WaitCondition instead of letting bash -xe exit
            # before cfn-signal runs. Without this a broken build is indistinguishable from
            # a slow one, and the stack sits until the WaitCondition times out: a two-minute
            # failure cost a fifty-minute rollback during development.
            if ! build_webfn_zip; then
              /opt/aws/bin/cfn-signal -e 1 -r "lambda-web zip build failed; see this instance's console output" '${PrivateWaitHandle}'
              exit 1
            fi
          fi

          if [[ ${ComputeType} == "lambda" ]]; then
            AMD64_DIG=$(regctl image digest --platform linux/amd64 public.ecr.aws/$IMG_LAMBDA:${BRConnectorVersion})
            ARM64_DIG=$(regctl image digest --platform linux/arm64 public.ecr.aws/$IMG_LAMBDA:${BRConnectorVersion})
            regctl image copy public.ecr.aws/$IMG_LAMBDA@$AMD64_DIG ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/$REPO_PREFIX/$IMG_LAMBDA:amd64
            regctl image copy public.ecr.aws/$IMG_LAMBDA@$ARM64_DIG ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/$REPO_PREFIX/$IMG_LAMBDA:arm64
          fi

          # start postgress db
          # PGHOST=$(aws ssm get-parameter --name /brconnector/pgdb-${AWS::StackName} --query 'Parameter.Value' --output text || echo "172.17.0.1")
          PGHOST=$(aws ssm get-parameter --name /brconnector/pgdb-${AWS::StackName} --query 'Parameter.Value' --output text)
          if [[ $PGHOST == "172.17.0.1" ]]; then
            docker run --restart=unless-stopped --name postgres -e POSTGRES_PASSWORD=${PGPassword} -p 5432:5432 -d postgres:16
            sleep 30; echo "CREATE DATABASE ${PGDatabase};" |docker exec -i postgres psql -U ${PGUser} 
          fi
          # if set to NoDB then set HOST and DATABASE to empty string
          if [[ $PGHOST == "NoDB" ]]; then
            PGHOST=""
          fi

          # # defaultSetTo empty string means false
          # PerformanceModeStr=""
          # if [[ ${PerformanceMode} == "true" || $PGHOST == "" ]];then
          #   PerformanceModeStr="true"
          # fi
          # start brconnector container in ECR
          IMG_EC2=x6u9o2u4/sample-connector-for-bedrock
          docker run --restart=unless-stopped --name brconnector -p 8866:8866 -e AWS_DEFAULT_REGION=${AWS::Region} -e PERFORMANCE_MODE=${PerformanceMode} -e PGSQL_HOST=$PGHOST -e PGSQL_DATABASE=${PGDatabase} -e PGSQL_USER=${PGUser} -e PGSQL_PASSWORD=${PGPassword} -e ADMIN_API_KEY=$KEY${CcEnvArg} -d public.ecr.aws/$IMG_EC2:${BRConnectorVersion}

          # create first user
          sleep 60
          curl "http://localhost:8866/"
          curl "http://localhost:8866/admin/api-key/list" -H "Authorization: Bearer $KEY"
          # if set dbmode to NoDB donnot generate first userkey
          if [[ $PGHOST != "" ]]; then
            curl -X POST "http://localhost:8866/admin/api-key/apply" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d '{"name": "adminuser","group_id": 1,"role": "admin","email": "", "month_quota":"20"}'
            # list users
            curl "http://localhost:8866/admin/api-key/list" -H "Authorization: Bearer $KEY" |jq -r . |tee /root/first-user-key.txt
            USERKEY=$(cat /root/first-user-key.txt |jq -r '.data.items[0].api_key')
            aws ssm put-parameter --name /brconnector/first-user-key-${AWS::StackName} --value "$USERKEY" --type String --overwrite
          fi
          aws ssm put-parameter --name /brconnector/admin-key-${AWS::StackName} --value "$KEY" --type String --overwrite

          # ensure ecs service linked role existed
          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com || echo "ecs service linked role already exists"

          # # add health check script to root's crontab
          # cat >/root/healthcheck.sh <<-EOF
          # #!/bin/bash
          # CURR=\$(date +%Y%m%d-%H%M%S)
          # STAT=\$(curl -sL -w '%{http_code}' -o /dev/null "http://localhost:8866")
          # if [[ \$STAT -ne 200 ]]; then
          #   docker restart brconnector
          #   echo "restart brconnector at \$CURR"
          # fi
          # EOF
          # chmod a+x /root/healthcheck.sh
          # echo '*/5 * * * * sh -x /root/healthcheck.sh >>/root/healthcheck.log 2>&1' |crontab -

          # prepare to delete self
          TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          INST_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -v http://169.254.169.254/latest/dynamic/instance-identity/document |jq -r .instanceId)
          aws lambda update-function-configuration --function-name ${DeleteEC2Lambda} --environment "Variables={INSTANCE_ID=$INST_ID}"

          # call back to cfn
          /opt/aws/bin/cfn-signal -s true '${PrivateWaitHandle}' # variable handled by cfn
          if [[ ${KeepEc2} != "true" && ( ${ComputeType} == "lambda" || ${ComputeType} == "lambda-web" ) ]]; then
            aws lambda invoke --function-name ${DeleteEC2Lambda} /tmp/output.log
          fi
        - CcEnvArg: !If
            - IsClaudeCodeWeb
            - !Sub " -e CC_CONFIG_PARAM=arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/brconnector/${AWS::StackName}/claude-code-web"
            - ''

  PrivateWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  PrivateWaitCondition:
    DependsOn: MyEC2Instance
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Handle: !Ref PrivateWaitHandle
      # The other paths copy a published image and signal in about 2-4 min. lambda-web
      # additionally installs Node, clones the repository, builds, installs ~240 MB of
      # production dependencies and uploads the zip, so it gets a longer budget. Timing
      # out here rolls back a stack that has already created RDS, which is slow and
      # expensive, so the budget is generous rather than tight.
      Timeout: !If [IsLambdaWeb, '2400', '600']
      Count: 1

  # ECRPullThroughCacheRule:
  #   Type: 'AWS::ECR::PullThroughCacheRule'
  #   Properties:
  #     EcrRepositoryPrefix: !Select
  #       - 0
  #       - !Split
  #         - '/'
  #         - !Ref PrivateECRRepository
  #     # UpstreamRegistryUrl: 'https://registry.hub.docker.com'
  #     UpstreamRegistryUrl: "public.ecr.aws"
  #     UpstreamRegistry: "ecr-public"

  PrivateECRRepository:
    Condition: IsLambda
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      RepositoryName: !Join
        - '/'
        - - !Sub ${EcrRepo}-${RandomString}
          - "x6u9o2u4/sample-connector-for-bedrock-lambda"

  RandomString:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt RandomStringLambda.Arn
      RandomLength: 12

  RandomStringLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          #
          # MIT-0 License
          #
          import random
          import string
          import cfnresponse
          import json
          
          def handler(event, context):
              status = cfnresponse.SUCCESS
              try:
                  random_length = int(event['ResourceProperties']['RandomLength'])
                  random_string = ''.join(random.choices(string.ascii_lowercase, k=random_length))
                  cfnresponse.send(event, context, status, {}, random_string)
              except Exception as e:
                  status = cfnresponse.FAILED
                  cfnresponse.send(event, context, status, {}, str(e))

      Handler: index.handler
      Runtime: python3.11
      Role: !GetAtt RandomStringLambdaExecutionRole.Arn

  RandomStringLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Ec2CloudFrontDistribution:
    Condition: IsEnableCloudfrontEc2
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: myEC2Origin
            DomainName: !GetAtt MyEC2Instance.PublicDnsName          
            CustomOriginConfig:
              HTTPPort: '8866'
              OriginProtocolPolicy: http-only
              # Claude Code Web: the first /cc call waits for an AgentCore microVM to start
              # before any byte comes back, which can exceed the 30-second default.
              OriginReadTimeout: !If [IsClaudeCodeWeb, 60, !Ref AWS::NoValue]
        Enabled: 'true'
        Comment: CloudFront distribution in front of EC2
        # ViewerProtocolPolicy: https-only
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          TargetOriginId: myEC2Origin
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Disable caching https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-policy-caching-disabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Allow all Viewer https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-origin-request-policies.html#managed-origin-request-policy-all-viewer
          # ForwardedValues:
          #   QueryString: 'false'
          #   Cookies:
          #     Forward: none
          ViewerProtocolPolicy: redirect-to-https
        ViewerCertificate:
          CloudFrontDefaultCertificate: 'true'

  LambdaCloudFrontDistribution:
    Condition: IsEnableCloudfrontLambda
    DependsOn:
    - BRConnectorLambdaUrl
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: LambdaOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt BRConnectorLambdaUrl.FunctionUrl]]
            OriginAccessControlId: !If 
              - IsPrivateLambdaPermission
              - !Ref LambdaCloudFrontDistributionOac
              - !Ref AWS::NoValue
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: 
                - TLSv1.2
        Enabled: 'true'
        Comment: CloudFront distribution in front of Lambda
        # ViewerProtocolPolicy: https-only
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          TargetOriginId: LambdaOrigin
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Disable caching https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-policy-caching-disabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-origin-request-policies.html#managed-origin-request-policy-all-viewer-except-host-header
          # ForwardedValues:
          #   QueryString: 'false'
          #   Cookies:
          #     Forward: none
          ViewerProtocolPolicy: redirect-to-https
          LambdaFunctionAssociations: !If 
            - IsPrivateLambdaPermission
            - 
              - EventType: origin-request # viewer-request has 53KB limit, it's too small
                LambdaFunctionARN: !Ref LambdaEdgeVersionArn
                IncludeBody: true
            - !Ref AWS::NoValue
        ViewerCertificate:
          CloudFrontDefaultCertificate: 'true'

  LambdaCloudFrontDistributionOac:
    Condition: IsEnableCloudfrontLambda
    Type: AWS::CloudFront::OriginAccessControl
    Properties: 
      OriginAccessControlConfig: 
          Description: An optional description for the origin access control
          Name: !Sub LambdaOAC-${AWS::StackName}
          OriginAccessControlOriginType: lambda
          SigningBehavior: always
          SigningProtocol: sigv4

  MySSMParameterFirstUserKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join ["", ["/brconnector/first-user-key-", !Ref AWS::StackName]]
      Type: String
      Value: Hello World
      Description: A parameter created by CloudFormation and updated by ec2
      Tier: Standard
      DataType: text

  MySSMParameterAdminKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join ["", ["/brconnector/admin-key-", !Ref AWS::StackName]]
      Type: String
      Value: Hello World
      Description: A parameter created by CloudFormation and updated by ec2
      Tier: Standard
      DataType: text

  MySSMParameterPGDB:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join ["", ["/brconnector/pgdb-", !Ref AWS::StackName]]
      Type: String
      Value: !If 
        - IsStandaloneDB
        - !GetAtt MyPG.Endpoint.Address
        - !If 
          - IsEC2IntegratedDB
          - "172.17.0.1"
          - !If 
            - IsNoDB
            - "NoDB"
            - "NULL"
      Description: A parameter created by CloudFormation and updated by RDS PostgreSQL
      Tier: Standard
      DataType: text

  BRConnectorLambdaRole:
    Condition: IsLambda
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      #- arn:aws:iam::aws:policy/AdministratorAccess
      - arn:aws:iam::aws:policy/AWSLambdaExecute
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
      - PolicyName: MyInlinePolicy-invokelambda
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Sid: InvokeLambda
            Action:
            - 'lambda:InvokeFunction'
            - 'lambda:InvokeFunctionUrl'
            Resource: '*'
      - PolicyName: MyInlinePolicy-bedrock
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Sid: InvokeModel
            Action:
            - 'bedrock:InvokeModelWithResponseStream'
            - 'bedrock:InvokeModel'
            Resource: 
            - 'arn:aws:bedrock:*::foundation-model/*'
            - 'arn:aws:bedrock:*:*:inference-profile/*'
          - Effect: Allow
            Sid: ListFM
            Action:
            - 'bedrock:ListFoundationModels'
            Resource: '*'
      - PolicyName: MyInlinePolicy-ssm-parameter
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Sid: SSMPutParameter
            Action:
            - 'ssm:PutParameter'
            - 'ssm:GetParameter'
            - 'ssm:GetParameters'
            Resource: 'arn:aws:ssm:*:*:parameter/*'
      - PolicyName: LambdaRDSAccess
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - rds:Connect
            - rds:Describe*
            - rds:List*
            Resource: '*'

  # Lambda Function 
  BRConnectorLambda:
    Condition: IsLambda	
    DependsOn:
      - PrivateWaitCondition
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - !FindInMap [ArchitectureMapping, !Ref LambdaArch, Architecture]
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${PrivateECRRepository}:${LambdaArch}" 
      # ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${PrivateECRRepository}:latest"
      # ImageUri: !Join ["", [!Ref "AWS::AccountId", ".dkr.ecr.", !Ref "AWS::Region", ".amazonaws.com/", !Join ['-', [!Ref 'EcrRepo', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]]], "/x6u9o2u4/sample-connector-for-bedrock-lambda:", !Ref LambdaArch]]
      PackageType: Image
      Policies:
        - AWSLambdaBasicExecutionRole 
      Role: !GetAtt BRConnectorLambdaRole.Arn
      MemorySize: 512
      Timeout: 60 
      Environment:
        Variables:
          AWS_LWA_AUTHORIZATION_SOURCE: !If [ IsPrivateLambdaPermission, "saved-authorization", "" ]
          ADMIN_API_KEY: !GetAtt MySSMParameterAdminKey.Value
          PERFORMANCE_MODE: !Ref PerformanceMode
          PGSQL_HOST: !If [ IsNoDB, "", !GetAtt MyPG.Endpoint.Address ]
          PGSQL_DATABASE: !If [ IsNoDB, "", !Ref PGDatabase ]
          PGSQL_USER: !Ref PGUser
          PGSQL_PASSWORD: !Ref PGPassword
      VpcConfig:
        !If
          - IsNoDB
          - {}
          - 
            SecurityGroupIds:
              - !Ref LambdaSecurityGroup
              - !Ref RdsSecurityGroup
            SubnetIds:
              - !If
                - UseExistingVpcStack
                - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet1Id"
                - !Ref PrivateSubnet1Id

  BRConnectorLambdaPermission1:
    Condition: IsPublicLambdaPermission
    DependsOn:
      - LambdaCloudFrontDistribution
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BRConnectorLambda
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  BRConnectorLambdaPermission2:
    Condition: IsPrivateLambdaPermission
    DependsOn:
      - LambdaCloudFrontDistribution
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BRConnectorLambda
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${LambdaCloudFrontDistribution}"
      FunctionUrlAuthType: AWS_IAM

  BRConnectorLambdaVersion:
    Condition: IsLambda	
    # DependsOn:
    #   - BRConnectorLambdaPermission1
    #   - BRConnectorLambdaPermission2
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref BRConnectorLambda
      # ProvisionedConcurrencyConfiguration:
      # ProvisionedConcurrentExecutions: 3

  BRConnectorLambdaUrl:
    Condition: IsLambda	
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref BRConnectorLambda
      AuthType:  !If [ IsPublicLambdaPermission, 'NONE', 'AWS_IAM']
      InvokeMode: RESPONSE_STREAM

  DeleteEC2Lambda:
    Type: AWS::Lambda::Function
    DependsOn: DeleteEC2LambdaExecutionRole
    Properties:
      Code:
        ZipFile: !Sub |
          #
          # MIT-0 License
          #
          import boto3,os

          def lambda_handler(event, context):
              ec2 = boto3.resource('ec2')
              instance_id = os.environ.get('INSTANCE_ID')
              instance = ec2.Instance(instance_id)
              instance.terminate()
              print(f"Terminated instance: {instance_id}")
      Handler: index.lambda_handler
      Role: !GetAtt DeleteEC2LambdaExecutionRole.Arn
      Runtime: python3.11
      MemorySize: 128
      Timeout: 60 
      Environment:
        Variables:
          INSTANCE_ID: ""

  DeleteEC2LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess

  # ECS Resources
  ECSCluster:
    Condition: IsEcs
    Type: AWS::ECS::Cluster
    DependsOn:
      - PrivateWaitCondition
    Properties:
      ClusterName: !Sub ${AWS::StackName}-cluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  ECSTaskExecutionRole:
    Condition: IsEcs
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess

  ECSTaskRole:
    Condition: IsEcs
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess
      Policies:
        - PolicyName: MyInlinePolicy-bedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Sid: InvokeModel
              Action:
              - 'bedrock:InvokeModelWithResponseStream'
              - 'bedrock:InvokeModel'
              - bedrock:ListFoundationModels
              Resource: 
              - 'arn:aws:bedrock:*::foundation-model/*'
              - 'arn:aws:bedrock:*:*:inference-profile/*'
            - Effect: Allow
              Sid: ListFM
              Action:
              - 'bedrock:ListFoundationModels'
              Resource: '*'
        - PolicyName: MyInlinePolicy-ssm-parameter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Sid: SSMPutParameter
              Action:
              - 'ssm:PutParameter'
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
              Resource: 'arn:aws:ssm:*:*:parameter/*'
        - PolicyName: RDSAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action:
              - rds:Connect
              - rds:Describe*
              - rds:List*
              Resource: '*'

  ECSTaskDefinition:
    Condition: IsEcs
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - PrivateWaitCondition
    Properties:
      Family: !Sub ${AWS::StackName}-task
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref ECSTaskCPU
      Memory: !Ref ECSTaskMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: brconnector
          Image: !Sub public.ecr.aws/x6u9o2u4/sample-connector-for-bedrock:${BRConnectorVersion}
          Essential: true
          PortMappings:
            - ContainerPort: 8866
              Protocol: tcp
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: PERFORMANCE_MODE
              Value: !Ref PerformanceMode
            - Name: PGSQL_HOST
              Value: !If [ IsNoDB, "", !GetAtt MyPG.Endpoint.Address ]
            - Name: PGSQL_DATABASE
              Value: !If [ IsNoDB, "", !Ref PGDatabase ]
            - Name: PGSQL_USER
              Value: !Ref PGUser
            - Name: PGSQL_PASSWORD
              Value: !Ref PGPassword
            - Name: ADMIN_API_KEY
              Value: !GetAtt MySSMParameterAdminKey.Value
            # Built from the parameter's fixed name, as on ec2 and lambda-web, where a Ref
            # would be circular.
            - !If
              - IsClaudeCodeWeb
              - Name: CC_CONFIG_PARAM
                Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/brconnector/${AWS::StackName}/claude-code-web
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: brconnector

  ECSLogGroup:
    Condition: IsEcs
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14

  ECSLBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ecs-lb-sg-${AWS::StackName}"
      GroupDescription: "Security Group for ECS LB"
      SecurityGroupIngress:
        - Description: Allow HTTP from com.amazonaws.global.cloudfront.origin-facing
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !FindInMap [AWSRegionsPrefixListID, !Ref 'AWS::Region', PrefixList]
      VpcId: !If 
        - UseExistingVpcStack
        - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
        - !Ref VpcId

  ECSLoadBalancer:
    Condition: IsEcs
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AWS::StackName}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ECSLBSecurityGroup
      Subnets:
        - !If
          - UseExistingVpcStack
          - Fn::ImportValue: !Sub "${VpcStackName}-PublicSubnet1Id"
          - !Ref PublicSubnet1Id
        - !If
          - UseExistingVpcStack
          - Fn::ImportValue: !Sub "${VpcStackName}-PublicSubnet2Id"
          - !Ref PublicSubnet2Id

  ECSTargetGroup:
    Condition: IsEcs
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AWS::StackName}-tg
      Port: 8866
      Protocol: HTTP
      TargetType: ip
      VpcId: !If 
        - UseExistingVpcStack
        - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
        - !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  ECSListener:
    Condition: IsEcs
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ECSLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ECSTargetGroup

  ECSService:
    Condition: IsEcs
    Type: AWS::ECS::Service
    DependsOn: ECSListener
    Properties:
      ServiceName: !Sub ${AWS::StackName}-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: !Ref ECSServiceDesiredCount
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: brconnector
          ContainerPort: 8866
          TargetGroupArn: !Ref ECSTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref InstanceSecurityGroup
            - !Ref RdsSecurityGroup
          Subnets:
            - !If
                - UseExistingVpcStack
                - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet1Id"
                - !Ref PrivateSubnet1Id

  ECSCloudFrontDistribution:
    Condition: IsEcs
    DependsOn: ECSLoadBalancer
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: ECSOrigin
            DomainName: !GetAtt ECSLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              # Claude Code Web: the first /cc call waits for an AgentCore microVM to start
              # before any byte comes back, which can exceed the 30-second default.
              OriginReadTimeout: !If [IsClaudeCodeWeb, 60, !Ref AWS::NoValue]
        Enabled: true
        Comment: CloudFront distribution in front of ECS
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          TargetOriginId: ECSOrigin
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          ViewerProtocolPolicy: redirect-to-https
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  CodeBuildSecurityGroup:
    Condition: IsAutoUpdateLambda
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "codebuild-security-group-${AWS::StackName}"
      GroupDescription: "CodeBuild Security Group with no ingress"
      VpcId: !If 
        - UseExistingVpcStack
        - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
        - !Ref VpcId

  CodeBuildRole:
    Condition: IsAutoUpdateLambda
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
        - arn:aws:iam::aws:policy/AWSCodeBuildAdminAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess

  CodeBuildProject:
    Condition: IsAutoUpdateLambda
    Type: AWS::CodeBuild::Project
    DependsOn: CodeBuildRole
    Properties:
      Name: !Sub MyCodeBuildProject-${AWS::StackName}
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo ${ACCOUNT_ID}
                - echo ${AWS_DEFAULT_REGION}
                - echo ${STACK_NAME}
                - DOCKERHUB_REPO=x6u9o2u4/sample-connector-for-bedrock-lambda
                - 
                - yum install -y jq 
                - |
                  if [[ ! -x /usr/local/bin/regctl ]]; then
                    curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 >regctl
                    chmod 755 regctl
                    sudo mv regctl /usr/local/bin
                  fi
                - 
                - export AWS_PAGER=""
                - # get ecr repo name
                - aws cloudformation describe-stacks --stack-name ${STACK_NAME} > /tmp/cfn.yaml
                - STACK_ID=$(cat /tmp/cfn.yaml |jq -r '.Stacks[].StackId')
                - REPO_PREFIX=$(cat /tmp/cfn.yaml |jq -r '.Stacks[].Outputs[] | select (.OutputKey == "EcrRepo") | .OutputValue')
                - ECR_REPO=${REPO_PREFIX%%/*}/${DOCKERHUB_REPO}
                - FUNCTION_NAME=$(cat /tmp/cfn.yaml |jq -r '.Stacks[].Outputs[] | select (.OutputKey == "MyFunctionName") | .OutputValue')
                - 
                - # login ecr
                - aws ecr-public get-login-password --region us-east-1 |regctl registry login --user AWS --pass-stdin public.ecr.aws
                - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | regctl registry login --user AWS --pass-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
                - # pull local
                - # docker pull ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:latest
                - 
                - # tag amd64 / arm64
                - regctl tag ls public.ecr.aws/${DOCKERHUB_REPO} |sort -t '.' -k3n
                - AMD64_DIG=$(regctl image digest --platform linux/amd64 public.ecr.aws/${DOCKERHUB_REPO}:latest)
                - ARM64_DIG=$(regctl image digest --platform linux/arm64 public.ecr.aws/${DOCKERHUB_REPO}:latest)
                - regctl image copy public.ecr.aws/${DOCKERHUB_REPO}@${AMD64_DIG} ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:amd64
                - regctl image copy public.ecr.aws/${DOCKERHUB_REPO}@${ARM64_DIG} ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:arm64
                - 
                - # update lambda function image uri
                - |
                  if [[ ! -z ${FUNCTION_NAME} ]]; then
                    echo "update lambda function image: " ${FUNCTION_NAME}
                    IMAGE_URI=$(aws lambda get-function --function-name ${FUNCTION_NAME} --query 'Code.ImageUri' --output text)
                    aws lambda update-function-code --function-name ${FUNCTION_NAME} --image-uri ${IMAGE_URI}
                  else
                    echo "cannot get lambda function name"
                  fi
                - 
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: STACK_NAME
            Value: !Ref AWS::StackName
      ServiceRole: !GetAtt CodeBuildRole.Arn
      VpcConfig:
        VpcId: !If 
          - UseExistingVpcStack
          - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
          - !Ref VpcId
        Subnets:
          - !If
            - UseExistingVpcStack
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet1Id"
            - !Ref PrivateSubnet1Id
          - !If
            - UseExistingVpcStack
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet2Id"
            - !Ref PrivateSubnet2Id
        SecurityGroupIds:
          - !Ref CodeBuildSecurityGroup

  # EventBridge Rule for codecommit build trigger
  CodeBuildEventRule: 
    Condition: IsAutoUpdateLambda
    Type: AWS::Events::Rule
    Properties: 
      Name: !Sub "codebuild-${AWS::StackName}"
      Description: "This event rule triggers the codebuild project"
      ScheduleExpression: 'cron(0 0 * * ? *)'
      State: "ENABLED"
      Targets: 
        - 
          Arn: {'Fn::GetAtt': [CodeBuildProject, Arn]}
          Id: cloudwatch-codebuild-eventrules  
          RoleArn: !GetAtt CodeBuildEventRole.Arn

  CodeBuildEventRole:
    Condition: IsAutoUpdateLambda
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - events.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: MyInlinePolicy-codebuild-trigger
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Sid: codebuildTrigger
            Action:
            - 'codebuild:StartBuild'
            Resource: !GetAtt CodeBuildProject.Arn

  S3Bucket:
    Condition: IsAutoUpdateEc2
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "ssmlogbucket-${MyEC2Instance}"

  EC2AutoUpdateSSMDocument: 
    Condition: IsAutoUpdateEc2
    Type: AWS::SSM::Document
    Properties: 
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      DocumentType: Command
      DocumentFormat: YAML
      Content: 
        schemaVersion: '2.2'
        description: Bootstrap EC2 Instance
        mainSteps:
        - action: aws:runShellScript
          name: AutoUpdateBrConnectorInEc2
          inputs:
            runCommand:
            - "#!/bin/bash -x"
            - BRC_DIGEST=$(docker images --digests public.ecr.aws/x6u9o2u4/sample-connector-for-bedrock |grep -v -e DIGEST -e grep |awk '{print $3}')
            - BRC_REG_DIGEST=$(regctl image digest public.ecr.aws/x6u9o2u4/sample-connector-for-bedrock:latest)
            - |
              if [[ $BRC_REG_DIGEST != $BRC_DIGEST ]]; then
                aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
                docker pull public.ecr.aws/x6u9o2u4/sample-connector-for-bedrock
                docker rm -f brconnector
                cat /var/log/cloud-init-output.log |egrep -o 'docker run .* --name brconnector .*' |sed 's/:[^:]\+$/:latest/' |sh
              fi
            - echo "Bootstrap Complete"

  EC2AutoUpdateAssociation: 
    Condition: IsAutoUpdateEc2
    Type: AWS::SSM::Association
    Properties: 
      Name: !Ref EC2AutoUpdateSSMDocument
      ScheduleExpression: "cron(0 0 * * ? *)"
      ApplyOnlyAtCronInterval: true
      OutputLocation: 
        S3Location:
          OutputS3BucketName: !Ref S3Bucket
          OutputS3KeyPrefix: ssmoutput
      Targets:
        - Key: tag:aws:cloudformation:stack-name
          Values:
          - !Sub ${AWS::StackName}


  # ---------------------------------------------------------------------------
  # ComputeType: lambda-web  (AWS Lambda Web Functions)
  #
  # The helper EC2 builds the deployment package and uploads it here, then signals
  # PrivateWaitCondition. Everything below waits on that signal, so the object exists
  # before the Web Function's revision is created.
  # ---------------------------------------------------------------------------

  WebFnCodeBucket:
    Condition: IsLambdaWeb
    Type: AWS::S3::Bucket
    # Retained on purpose. CloudFormation will not delete a bucket that still has
    # objects, and versioning is required here, so a rollback would have to remove every
    # version. Without Retain a failed create ends in ROLLBACK_FAILED and the operator has
    # to run delete-stack twice, the second time with --retain-resources, before the stack
    # will go away. Leaving an empty-cost bucket behind is the smaller problem; delete it
    # by hand after deleting the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Name is deterministic so the shared UserData can build it with Sub instead of
      # Ref'ing this conditional resource.
      BucketName: !Sub brconnector-webfn-${AWS::AccountId}-${AWS::Region}-${RandomString}
      # Versioning is required: a Web Function revision reads the object by version.
      VersioningConfiguration:
        Status: Enabled
      # SSE-S3 on purpose. Lambda cannot read an object encrypted with the AWS managed
      # aws/s3 KMS key, because that key's policy cannot be changed to allow it.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  WebFnCodeBucketPolicy:
    Condition: IsLambdaWeb
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebFnCodeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaWebFunctionRead
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
            Resource: !Sub arn:${AWS::Partition}:s3:::${WebFnCodeBucket}/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                # The source is the revision, not the function, so this must end in /*.
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/brconnector-webfn-${AWS::StackName}/revision/*
          - Sid: DenyPlaintextTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${WebFnCodeBucket}
              - !Sub arn:${AWS::Partition}:s3:::${WebFnCodeBucket}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Attached to the shared EC2Role rather than editing it, so the other paths are untouched.
  WebFnBuildUploadPolicy:
    Condition: IsLambdaWeb
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brconnector-webfn-upload-${AWS::StackName}
      Roles:
        - !Ref EC2Role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
              - 's3:GetObjectVersion'
            Resource: !Sub arn:${AWS::Partition}:s3:::${WebFnCodeBucket}/*

  BRConnectorWebFnExecRole:
    Condition: IsLambdaWeb
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MyInlinePolicy-bedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Sid: InvokeModel
                Action:
                  - 'bedrock:InvokeModelWithResponseStream'
                  - 'bedrock:InvokeModel'
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - 'arn:aws:bedrock:*:*:inference-profile/*'
              - Effect: Allow
                Sid: ListFM
                Action:
                  - 'bedrock:ListFoundationModels'
                Resource: '*'

  # Only exists when lambda-web has a database. A Web Function runs outside your VPC, so
  # this is the only way it reaches RDS. The connector sits in RdsSecurityGroup, whose
  # self-referencing 5432 ingress rule then covers it; default egress is allow-all, which
  # is what lets Bedrock traffic out through the private subnets' NAT route.
  BRConnectorWebFnConnector:
    Condition: IsLambdaWebWithDB
    Type: AWS::Serverless::NetworkConnector
    Properties:
      Name: !Sub brconnector-webfn-${AWS::StackName}
      ComputeTypes:
        - WebFunction
      VpcConfig:
        SubnetIds:
          - !If
            - UseExistingVpcStack
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet1Id"
            - !Ref PrivateSubnet1Id
          - !If
            - UseExistingVpcStack
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet2Id"
            - !Ref PrivateSubnet2Id
        SecurityGroupIds:
          - !Ref RdsSecurityGroup
        NetworkProtocol: IPv4

  BRConnectorWebFn:
    Condition: IsLambdaWeb
    # The zip has to be in the bucket before the revision is created, and the admin key
    # has to be seeded before the first request. Both happen on the helper EC2, which
    # signals PrivateWaitCondition when it is done.
    DependsOn:
      - PrivateWaitCondition
      - WebFnCodeBucketPolicy
    Type: AWS::Serverless::WebFunction
    Properties:
      FunctionName: !Sub brconnector-webfn-${AWS::StackName}
      Runtime: nodejs24.x
      AuthType: !Ref WebFnAuthType
      # Supplied explicitly. Omitting it makes SAM generate a role whose logical id is
      # <logical-id>Role, which collided with ours at transform time.
      ExecutionRoleArn: !GetAtt BRConnectorWebFnExecRole.Arn
      EndpointName: !Sub brc-${RandomString}
      EndpointType: HomeRegion
      CodeUri:
        Bucket: !Sub brconnector-webfn-${AWS::AccountId}-${AWS::Region}-${RandomString}
        Key: brconnector/function.zip
      # 900 rather than the lambda path's 60, so a long stream is not truncated.
      Timeout: 900
      EgressNetworkConnectorArn: !If
        - IsLambdaWebWithDB
        # Must be version-qualified; the unqualified Arn is rejected.
        - !GetAtt BRConnectorWebFnConnector.LatestVersionArn
        - !Ref AWS::NoValue
      # Values cannot be empty, so each key is omitted individually rather than set to "".
      EnvironmentVariables:
        ADMIN_API_KEY: !GetAtt MySSMParameterAdminKey.Value
        PERFORMANCE_MODE: !Ref PerformanceMode
        # Migrations are applied once by the helper EC2's container against the same RDS.
        # Without this every cold environment re-runs them, and two starting together on an
        # empty database can race on CREATE TABLE.
        SKIP_DB_INSTALL: 'true'
        PGSQL_HOST: !If [IsNoDB, !Ref AWS::NoValue, !GetAtt MyPG.Endpoint.Address]
        PGSQL_DATABASE: !If [IsNoDB, !Ref AWS::NoValue, !Ref PGDatabase]
        PGSQL_USER: !If [IsNoDB, !Ref AWS::NoValue, !Ref PGUser]
        PGSQL_PASSWORD: !If [IsNoDB, !Ref AWS::NoValue, !Ref PGPassword]
        # Built from the parameter's fixed name rather than a Ref: the parameter holds the
        # runtime ARN, and the runtime needs WebFnDistribution, which depends on this function.
        CC_CONFIG_PARAM: !If
          - IsClaudeCodeWeb
          - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/brconnector/${AWS::StackName}/claude-code-web
          - !Ref AWS::NoValue


  # CloudFront is how a browser reaches an IamAuth endpoint: no browser can SigV4-sign,
  # so OAC signs each origin request instead. It is always created for lambda-web; the
  # EnableCloudfront parameter does not apply to this path.
  WebFnOac:
    Condition: IsLambdaWebIamAuth
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub brconnector-webfn-oac-${AWS::StackName}
        Description: OAC for the BRConnector Lambda Web Function origin
        OriginAccessControlOriginType: lambda
        # sigv4 because the endpoint is regional (HomeRegion). A MultiRegion endpoint
        # would need sigv4a.
        SigningProtocol: sigv4
        # The only behaviour a Web Function origin accepts. CloudFront adds its signature
        # in its own header and passes the viewer's Authorization through untouched, which
        # is what lets BRConnector keep reading the caller's API key. It also supplies
        # x-amz-content-sha256, which a direct signed caller would have to send itself.
        SigningBehavior: always-amz-auth

  WebFnDistribution:
    Condition: IsLambdaWeb
    DependsOn: BRConnectorWebFn
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub BRConnector on Lambda Web Functions - ${AWS::StackName}
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: WebFnOrigin
            # SAM names the generated endpoint <logical-id>Endpoint.
            DomainName: !GetAtt BRConnectorWebFnEndpoint.DomainName
            OriginAccessControlId: !If [IsLambdaWebIamAuth, !GetAtt WebFnOac.Id, !Ref AWS::NoValue]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              # Claude Code Web: the first /cc call waits for an AgentCore microVM to start
              # before any byte comes back, which can exceed the 30-second default.
              OriginReadTimeout: !If [IsClaudeCodeWeb, 60, !Ref AWS::NoValue]
        DefaultCacheBehavior:
          TargetOriginId: WebFnOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Caching Disabled. Two reasons it must be disabled rather than tuned: the docs
          # say Authorization is only forwarded if it is in the cache key OR caching is
          # off, and BRConnector's responses are per-caller and metered, so a cached
          # response must never be served to a different key.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader, not AllViewer: the endpoint expects Host to be its
          # own domain and answers 404 if it is the distribution's.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          # No Lambda@Edge association. CloudFront rejects an origin-request trigger on a
          # Web Function origin with OAC, which is also why lambda-edge-use1.yaml is not
          # needed on this path.

  # Without this CloudFront gets 403 from the endpoint. Note AWS::Lambda::Permission
  # cannot express it: its FunctionName pattern rejects a web-function ARN.
  WebFnResourcePolicy:
    Condition: IsLambdaWebIamAuth
    Type: AWS::Lambda::ResourcePolicy
    Properties:
      ResourceArn: !GetAtt BRConnectorWebFn.FunctionArn
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 'lambda:InvokeWebFunctionEndpoint'
            Resource: !GetAtt BRConnectorWebFnEndpoint.EndpointArn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebFnDistribution}

  # ---------------------------------------------------------------------------
  # Claude Code Web  (EnableClaudeCodeWeb=true)
  #
  # BRConnector serves the web client at /cc and forwards its API calls, SigV4-signed
  # with the compute role, to an AgentCore Runtime running the claude-code-web backend,
  # one microVM per API key. Claude Code in the microVM calls back into BRConnector's
  # /v1/messages with the user's own key, so usage is metered per key and the microVM
  # holds no Bedrock permission. BRConnector finds the runtime through an SSM parameter
  # with a fixed name: the runtime needs BRConnector's CloudFront domain, so referencing
  # the runtime from the compute resources would be circular.
  # ---------------------------------------------------------------------------

  ClaudeCodeWebRepository:
    Condition: IsClaudeCodeWeb
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub brc-claude-code-web-${RandomString}
      EmptyOnDelete: true

  # Users' workspaces, under user_data/<user id>/. Retained for the same reason as
  # WebFnCodeBucket, and because it holds user files; delete it by hand if unwanted.
  ClaudeCodeWebWorkspaceBucket:
    Condition: IsClaudeCodeWeb
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub brc-cc-workspace-${AWS::AccountId}-${AWS::Region}-${RandomString}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # What the microVM runs as, and a user's shell can use these credentials. So it gets
  # only what AgentCore Runtime needs to pull the image and ship logs, traces and metrics:
  # "IAM Permissions for AgentCore Runtime" minus every bedrock:* statement, so model calls
  # must go through BRConnector, and with the log statements narrowed to this runtime. No
  # S3 either; workspace access arrives with each request, scoped to that user's prefix.
  # With web search it may also call this stack's web search gateway.
  ClaudeCodeWebRuntimeRole:
    Condition: IsClaudeCodeWeb
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: agentcore-runtime-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ClaudeCodeWebRepository.Arn
              - Sid: ECRTokenAccess
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              # Logs only for this runtime: AgentCore writes to
              # /aws/bedrock-agentcore/runtimes/<runtime id>-DEFAULT, and the runtime id starts
              # with AgentRuntimeName. The doc's runtimes/* would let a user's shell write into
              # every runtime's logs in the account.
              - Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                  - logs:PutResourcePolicy
                Resource: !Sub
                  - arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/brc_cc_${StackUuidHead}-*
                  - StackUuidHead: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub
                  - arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/brc_cc_${StackUuidHead}-*:log-stream:*
                  - StackUuidHead: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: GetAgentAccessToken
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub
                    - arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/brc_cc_${StackUuidHead}-*
                    - StackUuidHead: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
              - !If
                - IsClaudeCodeWebSearch
                - Sid: InvokeWebSearchGateway
                  Effect: Allow
                  Action: bedrock-agentcore:InvokeGateway
                  Resource: !GetAtt ClaudeCodeWebSearchGateway.GatewayArn
                - !Ref AWS::NoValue

  # BRConnector assumes this for each user, always with a session policy that narrows it
  # to user_data/<user id>/, and hands the result to that user's microVM. Only the
  # current compute type's role may assume it.
  ClaudeCodeWebWorkspaceAccessRole:
    Condition: IsClaudeCodeWeb
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - IsEcs
                - !GetAtt ECSTaskRole.Arn
                - !If [IsLambdaWeb, !GetAtt BRConnectorWebFnExecRole.Arn, !GetAtt EC2Role.Arn]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: claude-code-web-workspace
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${ClaudeCodeWebWorkspaceBucket}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ClaudeCodeWebWorkspaceBucket}

  ClaudeCodeWebBuildRole:
    Condition: IsClaudeCodeWeb
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: claude-code-web-image-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-claude-code-web-image
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-claude-code-web-image:*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ClaudeCodeWebRepository.Arn

  # Builds claude-code-web/Dockerfile from SourceRepoUrl@SourceRef on native arm64, which
  # AgentCore Runtime requires, smoke-tests it, pushes it and answers ClaudeCodeWebImage
  # itself: the build outlives a Lambda, so the trigger only starts it. Every exit path
  # answers, success with the digest URI, failure with the step that failed; a build that
  # never answers would leave the stack waiting for the full ServiceTimeout.
  ClaudeCodeWebImageBuild:
    Condition: IsClaudeCodeWeb
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-claude-code-web-image
      Description: Builds the Claude Code Web backend image for AgentCore Runtime
      ServiceRole: !GetAtt ClaudeCodeWebBuildRole.Arn
      # The script's own step limits end a hung build with a FAILED answer first. A build
      # killed at this timeout, or one still queued after QueuedTimeoutInMinutes, sends no
      # answer, and the stack then waits for ServiceTimeout.
      TimeoutInMinutes: 50
      QueuedTimeoutInMinutes: 15
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPO_URI
            Value: !GetAtt ClaudeCodeWebRepository.RepositoryUri
      Source:
        Type: NO_SOURCE
        # Started by ClaudeCodeWebBuildTrigger, which adds CFN_RESPONSE_URL, CFN_STACK_ID,
        # CFN_REQUEST_ID, CFN_LOGICAL_RESOURCE_ID, CFN_PHYSICAL_RESOURCE_ID,
        # SOURCE_REPO_URL, SOURCE_REF and IMAGE_TAG.
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                - |
                  # One subshell for the whole build, so its EXIT trap fires on every path.
                  (
                  set -euo pipefail
                  STEP=start
                  ANSWERED=0
                  CID=
                  # Answer the custom resource. Every value is generated by AWS or by this
                  # script and holds no quote or backslash, so printf builds valid JSON.
                  answer() {
                    local data='{}'
                    if [ -n "${3:-}" ]; then data="{\"ImageUri\":\"$3\"}"; fi
                    printf '{"Status":"%s","Reason":"%s","PhysicalResourceId":"%s","StackId":"%s","RequestId":"%s","LogicalResourceId":"%s","Data":%s}' \
                      "$1" "$2" "$CFN_PHYSICAL_RESOURCE_ID" "$CFN_STACK_ID" "$CFN_REQUEST_ID" "$CFN_LOGICAL_RESOURCE_ID" "$data" > resp.json
                    curl -sS -f --max-time 20 --retry 3 -X PUT -H 'Content-Type:' --data-binary @resp.json "$CFN_RESPONSE_URL"
                  }
                  on_exit() {
                    local rc=$?
                    if [ -n "$CID" ]; then
                      docker logs --tail 50 "$CID" || true
                      docker rm -f "$CID" > /dev/null 2>&1 || true
                    fi
                    if [ "$ANSWERED" != 1 ]; then
                      answer FAILED "Claude Code Web image build failed at step $STEP (exit $rc), see CodeBuild build $CODEBUILD_BUILD_ID" || true
                    fi
                  }
                  trap on_exit EXIT
                  trap 'exit 143' TERM INT
                  # Each slow step has its own limit, about 41 minutes in all, so a hung step
                  # fails (timeout exits 124) and is answered well before the 50-minute build
                  # timeout, which would kill the build without an answer.

                  STEP=git-clone
                  timeout 3m git clone --quiet --filter=blob:none "$SOURCE_REPO_URL" src
                  timeout 2m git -C src checkout --quiet "$SOURCE_REF"
                  git -C src log -1 --format='building commit %H'

                  STEP=ecr-login
                  timeout 2m aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | timeout 2m docker login --username AWS --password-stdin "${REPO_URI%%/*}"

                  STEP=docker-build
                  IMAGE="$REPO_URI:$IMAGE_TAG"
                  timeout 20m docker build --platform linux/arm64 -t "$IMAGE" src/claude-code-web

                  # Before the push, so a broken image never reaches the repository.
                  STEP=smoke-test
                  CID=$(timeout 1m docker run -d -e ENABLE_S3_SYNC=false -p 8080:8080 "$IMAGE")
                  for _ in $(seq 1 45); do
                    if curl -sf --max-time 2 -o /dev/null http://localhost:8080/ping; then break; fi
                    sleep 2
                  done
                  curl -sf --max-time 5 http://localhost:8080/ping
                  echo
                  RUN_UID=$(timeout 1m docker exec "$CID" id -u)
                  echo "container runs as uid $RUN_UID"
                  if [[ ! "$RUN_UID" =~ ^[0-9]+$ || "$RUN_UID" == 0 ]]; then echo "the image must not run as root"; exit 1; fi
                  docker rm -f "$CID" > /dev/null
                  CID=

                  STEP=docker-push
                  timeout 8m docker push "$IMAGE"

                  STEP=read-digest
                  IMAGE_URI=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
                  if [[ "$IMAGE_URI" != "$REPO_URI@sha256:"* ]]; then echo "unexpected image reference $IMAGE_URI"; exit 1; fi

                  STEP=answer-success
                  answer SUCCESS "Built $IMAGE_URI" "$IMAGE_URI"
                  ANSWERED=1
                  echo "answered SUCCESS with $IMAGE_URI"
                  )

  ClaudeCodeWebBuildTriggerRole:
    Condition: IsClaudeCodeWeb
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-claude-code-web-image-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt ClaudeCodeWebImageBuild.Arn

  ClaudeCodeWebBuildTrigger:
    Condition: IsClaudeCodeWeb
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt ClaudeCodeWebBuildTriggerRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref ClaudeCodeWebImageBuild
          # What a successful build reports, the same on every update, so an update never
          # looks like a replacement.
          PHYSICAL_RESOURCE_ID: !Sub ${AWS::StackName}-claude-code-web-image
      Code:
        ZipFile: |
          #
          # MIT-0 License
          #
          # Custom::ClaudeCodeWebImage. Create and Update only start the CodeBuild build,
          # which answers CloudFormation itself when it finishes; this function answers
          # only Delete and a build that could not be started. Those answers echo the
          # request's PhysicalResourceId when it has one: after a create that timed out,
          # the rollback Delete carries an id CloudFormation assigned, not ours.
          import json
          import os
          import urllib.request

          import boto3


          def respond(event, status, reason):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason[:1000],
                  'PhysicalResourceId': event.get('PhysicalResourceId') or os.environ['PHYSICAL_RESOURCE_ID'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {},
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT', headers={'Content-Type': ''})
              with urllib.request.urlopen(req, timeout=30):
                  pass


          def handler(event, context):
              print('request', event['RequestType'], event['LogicalResourceId'])
              if event['RequestType'] == 'Delete':
                  # The image is removed with the repository (EmptyOnDelete).
                  respond(event, 'SUCCESS', 'Nothing to delete')
                  return
              try:
                  props = event['ResourceProperties']
                  env = {
                      'CFN_RESPONSE_URL': event['ResponseURL'],
                      'CFN_STACK_ID': event['StackId'],
                      'CFN_REQUEST_ID': event['RequestId'],
                      'CFN_LOGICAL_RESOURCE_ID': event['LogicalResourceId'],
                      'CFN_PHYSICAL_RESOURCE_ID': os.environ['PHYSICAL_RESOURCE_ID'],
                      'SOURCE_REPO_URL': props['SourceRepoUrl'],
                      'SOURCE_REF': props['SourceRef'],
                      'IMAGE_TAG': props['BRConnectorVersion'],
                  }
                  build = boto3.client('codebuild').start_build(
                      projectName=os.environ['PROJECT_NAME'],
                      environmentVariablesOverride=[
                          {'name': k, 'value': v, 'type': 'PLAINTEXT'} for k, v in env.items()
                      ],
                  )
                  print('started build', build['build']['id'])
              except Exception as e:
                  respond(event, 'FAILED', f'Could not start the image build: {type(e).__name__}: {e}')

  # Rebuilt only when one of its properties changes; ImageUri is <repository>@sha256:...
  ClaudeCodeWebImage:
    Condition: IsClaudeCodeWeb
    Type: Custom::ClaudeCodeWebImage
    Properties:
      ServiceToken: !GetAtt ClaudeCodeWebBuildTrigger.Arn
      # Seconds. The build answers on every exit path, so this is only a backstop.
      ServiceTimeout: 3600
      SourceRepoUrl: !Ref SourceRepoUrl
      SourceRef: !Ref SourceRef
      BRConnectorVersion: !Ref BRConnectorVersion
      # Only here, so changing it rebuilds the image and nothing else.
      BuildId: !Ref ClaudeCodeWebImageBuildId

  ClaudeCodeWebRuntime:
    Condition: IsClaudeCodeWeb
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      # Names allow only [a-zA-Z][a-zA-Z0-9_]{0,47}, and a stack name may hold hyphens, so
      # the first group of the stack id's UUID makes it unique instead.
      AgentRuntimeName: !Sub
        - brc_cc_${StackUuidHead}
        - StackUuidHead: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      Description: !Sub Claude Code Web backend for BRConnector stack ${AWS::StackName}
      RoleArn: !GetAtt ClaudeCodeWebRuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          # The digest, not the tag: with :latest unchanged a rebuilt image would never
          # reach the runtime.
          ContainerUri: !GetAtt ClaudeCodeWebImage.ImageUri
      # No AuthorizerConfiguration, so the runtime accepts only SigV4 (IAM), which only
      # BRConnector's role is granted.
      NetworkConfiguration:
        NetworkMode: PUBLIC
      # AgentCore forwards only allowlisted X-Amzn-Bedrock-AgentCore-Runtime-Custom-*
      # headers. These carry the user's key and workspace credentials per request.
      RequestHeaderConfiguration:
        RequestHeaderAllowlist:
          - X-Amzn-Bedrock-AgentCore-Runtime-Custom-Brc-Api-Key
          - X-Amzn-Bedrock-AgentCore-Runtime-Custom-Brc-Aws-Access-Key-Id
          - X-Amzn-Bedrock-AgentCore-Runtime-Custom-Brc-Aws-Secret-Access-Key
          - X-Amzn-Bedrock-AgentCore-Runtime-Custom-Brc-Aws-Session-Token
      EnvironmentVariables:
        CLAUDE_CODE_USE_BEDROCK: '0'
        # Claude Code appends /v1/messages. The Rules exclude lambda, so this is the
        # distribution of ecs, lambda-web or ec2.
        ANTHROPIC_BASE_URL: !If
          - IsEcs
          - !Sub https://${ECSCloudFrontDistribution.DomainName}
          - !If
            - IsLambdaWeb
            - !Sub https://${WebFnDistribution.DomainName}
            - !Sub https://${Ec2CloudFrontDistribution.DomainName}
        ANTHROPIC_MODEL: !Ref ClaudeCodeDefaultModel
        ANTHROPIC_DEFAULT_HAIKU_MODEL: !Ref ClaudeCodeBackgroundModel
        S3_WORKSPACE_BUCKET: !Ref ClaudeCodeWebWorkspaceBucket
        S3_WORKSPACE_PREFIX: user_data
        AWS_DEFAULT_REGION: !Ref AWS::Region
        AGENTCORE_WEB_SEARCH_GATEWAY_URL: !If
          - IsClaudeCodeWebSearch
          - !GetAtt ClaudeCodeWebSearchGateway.GatewayUrl
          - !Ref AWS::NoValue

  # Read by BRConnector through CC_CONFIG_PARAM, the ARN of this fixed name.
  ClaudeCodeWebConfigParameter:
    Condition: IsClaudeCodeWeb
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /brconnector/${AWS::StackName}/claude-code-web
      Type: String
      Value: !Sub '{"runtimeArn":"${ClaudeCodeWebRuntime.AgentRuntimeArn}","workspaceRoleArn":"${ClaudeCodeWebWorkspaceAccessRole.Arn}","bucket":"${ClaudeCodeWebWorkspaceBucket}","prefix":"user_data"}'
      Description: Claude Code Web settings for BRConnector, created by CloudFormation
      Tier: Standard
      DataType: text

  # Attached to the current compute type's role rather than editing it, so the other
  # paths are untouched.
  ClaudeCodeWebComputePolicy:
    Condition: IsClaudeCodeWeb
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brconnector-claude-code-web-${AWS::StackName}
      Roles:
        - !If
          - IsEcs
          - !Ref ECSTaskRole
          - !If [IsLambdaWeb, !Ref BRConnectorWebFnExecRole, !Ref EC2Role]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeClaudeCodeWebRuntime
            Effect: Allow
            Action:
              - bedrock-agentcore:InvokeAgentRuntime
              - bedrock-agentcore:StopRuntimeSession
            Resource:
              - !GetAtt ClaudeCodeWebRuntime.AgentRuntimeArn
              - !Sub ${ClaudeCodeWebRuntime.AgentRuntimeArn}/runtime-endpoint/*
          - Sid: AssumeClaudeCodeWebWorkspaceRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt ClaudeCodeWebWorkspaceAccessRole.Arn
          - Sid: ReadClaudeCodeWebConfig
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/brconnector/${AWS::StackName}/claude-code-web

  # ---------------------------------------------------------------------------
  # Web search for Claude Code Web  (EnableWebSearch=true, in a Region with AgentCore
  # Web Search)
  #
  # An AgentCore Gateway with the Web Search connector: an MCP server at
  # https://<gateway id>.gateway.bedrock-agentcore.<region>.amazonaws.com/mcp that accepts
  # SigV4 (IAM) calls only. Only the runtime role may call it.
  # Searches are billed per query to this account, not to any key.
  # ---------------------------------------------------------------------------

  # The gateway uses this to call the connector. A gateway id is its name, a hyphen and
  # ten characters, so the trust and the grant name this stack's gateway only.
  ClaudeCodeWebSearchGatewayRole:
    Condition: IsClaudeCodeWebSearch
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub
                  - arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/brc-cc-ws-${StackUuidHead}-*
                  - StackUuidHead: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      Policies:
        - PolicyName: agentcore-web-search
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub
                  - arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/brc-cc-ws-${StackUuidHead}-*
                  - StackUuidHead: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
              # Owned by the service (account "aws") and checked on every search.
              - Sid: InvokeWebSearch
                Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1

  ClaudeCodeWebSearchGateway:
    Condition: IsClaudeCodeWebSearch
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      # Names allow only ([0-9a-zA-Z][-]?){1,48}, so the first group of the stack id's
      # UUID makes it unique, as for the runtime.
      Name: !Sub
        - brc-cc-ws-${StackUuidHead}
        - StackUuidHead: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      Description: !Sub AgentCore Web Search for Claude Code Web, BRConnector stack ${AWS::StackName}
      AuthorizerType: AWS_IAM
      ProtocolType: MCP
      RoleArn: !GetAtt ClaudeCodeWebSearchGatewayRole.Arn

  # Exposes the connector's WebSearch tool as web-search___WebSearch. No version pin: the
  # target gets the connector's current version.
  ClaudeCodeWebSearchTarget:
    Condition: IsClaudeCodeWebSearch
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref ClaudeCodeWebSearchGateway
      Name: web-search
      TargetConfiguration:
        Mcp:
          Connector:
            Source:
              ConnectorId: web-search
            Configurations:
              - Name: WebSearch
                ParameterValues: {}
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

Outputs:
  WebFnCloudFrontURL:
    Condition: IsLambdaWeb
    Description: BRConnector URL on Lambda Web Functions, through CloudFront. Use this one.
    Value: !Sub https://${WebFnDistribution.DomainName}
  WebFnManagerURL:
    Condition: IsLambdaWeb
    Description: BRConnector admin UI
    Value: !Sub https://${WebFnDistribution.DomainName}/manager/
  WebFnEndpointDomain:
    Condition: IsLambdaWeb
    Description: >-
      The Web Function endpoint itself; prefer the CloudFront URL. What reaches it depends
      on WebFnAuthType. Under IamAuth (the default) a caller must SigV4-sign for service
      lambda AND send an X-Amz-Content-SHA256 header, which even a request with no body
      must include; CloudFront supplies both, so browsers use the distribution. Under
      ApplicationManaged this name is reachable by anyone on the internet who knows it,
      with no AWS-layer authentication, so BRConnector's own API key is the only check and
      this name bypasses anything attached to the distribution.
    Value: !GetAtt BRConnectorWebFnEndpoint.DomainName
  WebFnCodeBucketName:
    Condition: IsLambdaWeb
    Description: >-
      Bucket holding the deployment package built by the helper EC2. It is retained when
      the stack is deleted, because CloudFormation cannot delete a non-empty versioned
      bucket; empty and remove it by hand afterwards.
    Value: !Ref WebFnCodeBucket
  CloudFrontEc2URL:
    Condition: IsEnableCloudfrontEc2
    Description: BRConnector URL
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - Ec2CloudFrontDistribution
          - DomainName
  CloudFrontEc2ManagerURL:
    Condition: IsEnableCloudfrontEc2
    Description: BRConnector Manager URL
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - Ec2CloudFrontDistribution
          - DomainName
        - '/manager'
  CloudFrontEc2BrclientURL:
    Condition: IsEnableCloudfrontEc2
    Description: BRClient WebUI
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - Ec2CloudFrontDistribution
          - DomainName
        - '/brclient'
  
  CloudFrontLambdaURL:
    Condition: IsEnableCloudfrontLambda
    Description: BRConnector URL
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - LambdaCloudFrontDistribution
          - DomainName
  CloudFrontLambdaManagerURL:
    Condition: IsEnableCloudfrontLambda
    Description: BRConnector Manager URL
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - LambdaCloudFrontDistribution
          - DomainName
        - '/manager'
  CloudFrontLambdaBrclientURL:
    Condition: IsEnableCloudfrontLambda
    Description: BRClient WebUI
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - LambdaCloudFrontDistribution
          - DomainName
        - '/brclient'

  CloudFrontEcsURL:
    Condition: IsEcs
    Description: BRConnector URL
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - ECSCloudFrontDistribution
          - DomainName
  CloudFrontEcsManagerURL:
    Condition: IsEcs
    Description: BRConnector Manager URL
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - ECSCloudFrontDistribution
          - DomainName
        - '/manager'
  CloudFrontEcsBrclientURL:
    Condition: IsEcs
    Description: BRClient WebUI
    Value: 
      Fn::Join:
      - ''
      - - https://
        - Fn::GetAtt: 
          - ECSCloudFrontDistribution
          - DomainName
        - '/brclient'

  MyPGEndpoint:
    Condition: IsStandaloneDB
    Description: The Endpoint of the RDS PostgreSQL
    Value: !GetAtt MyPG.Endpoint.Address
  EC2InstanceId:
    Description: The ID of the EC2 instance
    Value: !Ref MyEC2Instance
  MySSMParameterFirstUserKey:
    Description: First User API Key
    Value: !If 
        - IsNoDB
        - !GetAtt MySSMParameterAdminKey.Value
        - !GetAtt MySSMParameterFirstUserKey.Value
  # MySSMParameterAdminKey:
  #   Description: Admin Key
  #   Value: !GetAtt MySSMParameterAdminKey.Value
  # MyFunctionUrl:
  #   Condition: IsLambda
  #   Description: Lambda URL
  #   Value: !GetAtt BRConnectorLambdaUrl.FunctionUrl
  MyFunctionName:
    Condition: IsLambda
    Description: Lambda Name (needed by AutoUpdate)
    Value: !Ref BRConnectorLambda
  EcrRepo:
    Condition: IsLambda
    Description: EcrRepo Name (needed by AutoUpdate)
    Value: !Ref PrivateECRRepository

  MyFunctionUrl:
    Condition: IsLambda
    Description: Lambda URL (debug)
    Value: !GetAtt BRConnectorLambdaUrl.FunctionUrl

  ClaudeCodeWebUrl:
    Condition: IsClaudeCodeWeb
    Description: >-
      Claude Code Web. Sign in with a BRConnector API key (not the admin key) bound to
      the Claude Code models as bedrock-runtime-anthropic models.
    Value: !If
      - IsEcs
      - !Sub https://${ECSCloudFrontDistribution.DomainName}/cc/
      - !If
        - IsLambdaWeb
        - !Sub https://${WebFnDistribution.DomainName}/cc/
        - !Sub https://${Ec2CloudFrontDistribution.DomainName}/cc/

  WebSearchGatewayUrl:
    Condition: IsClaudeCodeWebSearch
    Description: >-
      MCP endpoint of the AgentCore Web Search gateway for Claude Code Web. It accepts
      SigV4 (IAM) calls only. Searches are billed per query to this account.
    Value: !GetAtt ClaudeCodeWebSearchGateway.GatewayUrl
